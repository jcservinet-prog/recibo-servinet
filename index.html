<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERVINET JC - Recibo Digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div class="ticket">
      
      <!-- ENCABEZADO CON LOGO Y TÍTULO -->
      <div class="ticket-header">
        <div class="logo-title-row">
          <img src="servinet.jpg" alt="Logo SERVINET JC" class="header-logo">
          <div class="title-text">
            <h3>SERVINET JC</h3>
            <p>Conectándote al Futuro!!</p>
          </div>
        </div>
        <div class="folio-row">
          <label>Nº</label>
          <input type="text" id="folio" value="000557">
        </div>
      </div>

      <div class="ticket-body">
        <div class="row">
          <label>Fecha:</label>
          <input type="date" id="fecha">
        </div>

        <div class="row">
          <label>Cliente:</label>
          <input type="text" id="nombre" placeholder="Nombre completo del cliente">
        </div>

        <!-- DIRECCIÓN CON DESPLEGABLE / COMBO BOX -->
        <div class="row">
          <label>Dirección:</label>
          <select id="direccion">
            <option value="" disabled selected>-- Seleccione Ubicación --</option>
            <option value="Candelaria">Candelaria</option>
            <option value="La Azotea">La Azotea</option>
            <option value="Realhuit">Realhuit</option>
            <option value="Pachali">Pachali</option>
            <option value="Los Sajquiyes">Los Sajquiyes</option>
            <option value="San Jerónimo">San Jerónimo</option>
          </select>
        </div>

        <hr>

        <!-- SERVICIOS CON CASILLAS CLARAS -->
        <div class="row-services">
          <label class="section-title-inline">Servicio:</label>
          <label class="check-item"><input type="checkbox" id="srvInstalacion"> Instalación</label>
          <label class="check-item"><input type="checkbox" id="srvMultimedia"> Paquete Multimedia</label>
        </div>

        <hr>

        <!-- MESES CON CASILLAS CLARAS -->
        <label class="section-label">Pago correspondiente al mes de:</label>
        <div class="meses-grid">
          <label class="check-item"><input type="checkbox" class="mes-check" value="Enero"> Ene</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Febrero"> Feb</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Marzo"> Mar</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Abril"> Abr</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Mayo"> May</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Junio"> Jun</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Julio"> Jul</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Agosto"> Ago</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Septiembre"> Sep</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Octubre"> Oct</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Noviembre"> Nov</label>
          <label class="check-item"><input type="checkbox" class="mes-check" value="Diciembre"> Dic</label>
        </div>

        <hr>

        <!-- CUOTA CENTRADA EN ROJO Y SIN FLECHAS -->
        <div class="cuota-box">
          <label>CUOTA: Q</label>
          <input type="number" id="cuota" placeholder="0.00">
        </div>

        <!-- OBSERVACIONES A ANCHO COMPLETO -->
        <div class="comentarios-box">
          <label class="section-label">Observaciones:</label>
          <textarea id="comentarios" placeholder="Escribir alguna nota u Observaciones aquí..."></textarea>
        </div>
      </div>

      <div class="ticket-footer">
        <p>📞 5492-6532 / 3243-0074</p>
      </div>

      <div class="actions">
        <button type="button" id="btnWhatsApp">Enviar por WhatsApp</button>
        <button type="button" onclick="window.print()">Guardar en PDF / Imprimir</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
